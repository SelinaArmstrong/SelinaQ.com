<!doctype html>
<!-- The 1200x630 Open Graph card. Not deployed; render it to
     public/assets/selina-armstrong.jpg whenever the name, title or
     palette changes:

     chrome --headless --window-size=1200,630 \
       --screenshot=card.png --virtual-time-budget=5000 \
       file://<abs path>/design/og-card.html
     magick card.png -quality 86 public/assets/selina-armstrong.jpg

     The surface is the site's own inverted plane (--nv-bg-a/b in
     styles.css), not a brand navy: a social card that does not match
     the page it links to is a card for some other site. -->
<html lang="en-US">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: Geist;
    src: url("../public/assets/fonts/geist.woff2") format("woff2");
    font-weight: 400 800;
    font-display: block;
  }
  :root {
    --bg-a: #1A212C;          /* --nv-bg-a */
    --bg-b: #0F141B;          /* --nv-bg-b */
    --line: #2B3340;          /* --nv-line */
    --rule: #5A6472;          /* --nv-rule */
    --text: #EDEFF2;          /* --nv-text */
    --text-2: #A7ADB6;        /* --nv-text-2 */
    --dim: #79808B;           /* the surname, one step back */
    --hl: #58A6FF;            /* --nv-hl */
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 86px;
    font-family: Geist, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(58% 70% at 8% 6%, rgb(88 166 255 / .10), transparent 70%),
      radial-gradient(52% 62% at 96% 98%, rgb(88 166 255 / .07), transparent 72%),
      linear-gradient(168deg, var(--bg-a), var(--bg-b));
  }
  .frame {
    position: absolute; inset: 26px; border: 1px solid var(--line); pointer-events: none;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 18px;
    color: var(--hl); font-size: 19px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase;
  }
  .eyebrow i { width: 46px; height: 1px; background: var(--rule); }
  .name {
    margin-top: 30px; font-size: 128px; line-height: .96;
    letter-spacing: -.045em; font-weight: 500;
  }
  .name span { display: block; }
  .name .last { color: var(--dim); }
  .foot {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-top: 54px; padding-top: 28px; border-top: 1px solid var(--line);
    font-size: 24px; color: var(--text-2); letter-spacing: -.005em;
  }
  .foot .url { color: var(--hl); font-weight: 600; }
</style>
</head>
<body>
  <div class="frame"></div>
  <p class="eyebrow"><i></i>Senior Contract Specialist</p>
  <h1 class="name"><span>Selina</span><span class="last">Armstrong</span></h1>
  <div class="foot">
    <span>Contract management · Contract operations · CLM &amp; AI automation</span>
    <span class="url">selinaq.com</span>
  </div>
</body>
</html>
